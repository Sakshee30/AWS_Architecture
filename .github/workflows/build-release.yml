name: Build Signed Release Artifact
on: {push: {tags: ["v*"]}}
permissions: {contents: read, packages: write, id-token: write, attestations: write}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: docker/setup-buildx-action@v3
   - run: docker build -f infrastructure/docker/api.Dockerfile -t ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA} .
   - uses: aquasecurity/trivy-action@0.28.0
     with: {image-ref: "ghcr.io/${{ github.repository }}/api:${{ github.sha }}", format: table, exit-code: "1", severity: "HIGH,CRITICAL"}
   - name: Generate SBOM
     uses: anchore/sbom-action@v0
     with: {image: "ghcr.io/${{ github.repository }}/api:${{ github.sha }}", artifact-name: api-sbom.spdx.json}
   - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && docker push ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}
   - uses: actions/attest-build-provenance@v2
     with: {subject-path: "api-sbom.spdx.json"}
