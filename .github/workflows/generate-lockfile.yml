name: Generate workspace lockfile
on:
  pull_request:
    types: [reopened]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.head_ref == 'integrate-sections-1-15' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-sections-1-15
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deterministic workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "Sakshee30"
          git config user.email "98686393+Sakshee30@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Add workspace dependency lockfile"
          git push origin HEAD:integrate-sections-1-15
