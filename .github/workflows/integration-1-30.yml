name: Sections 1-30 Integration Contract
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package-lock.json') != '' }}
        with: {node-version: "22"}
      - name: Section 16-30 static architecture checks
        run: |
          python tests/architecture/validate_integration_1_15.py
          for f in tests/architecture/validate_section*.py; do python "$f"; done
      - name: TypeScript typecheck when lockfile is available
        if: ${{ hashFiles('package.json') != '' && hashFiles('tsconfig.json') != '' && hashFiles('package-lock.json') != '' }}
        run: |
          npm ci
          npm run typecheck --if-present
      - name: Record missing lockfile as integration evidence gap
        if: ${{ hashFiles('package.json') != '' && hashFiles('tsconfig.json') != '' && hashFiles('package-lock.json') == '' }}
        run: echo "Root workspace is present but package-lock.json is not committed; static architecture checks passed and runtime dependency install remains evidence-pending."
