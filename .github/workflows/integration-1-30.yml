name: Sections 1-30 Integration Contract
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Section 16-30 static architecture checks
        run: |
          python tests/architecture/validate_integration_1_15.py
          for f in tests/architecture/validate_section*.py; do python "$f"; done
      - name: Install integrated workspace
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock=false
          fi
      - name: TypeScript typecheck
        run: npm run typecheck --if-present
      - name: Full integrated test suite
        run: npm test --if-present
