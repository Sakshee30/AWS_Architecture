name: Quality Matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce dependency direction
        run: python tests/architecture/forbidden_imports.py
      - name: Validate architecture sections
        run: |
          for file in tests/architecture/validate_section*.py; do
            python "$file"
          done

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - unit
          - integration
          - contract
          - e2e
          - security
          - performance
          - resilience
          - chaos
          - backup-restore
          - migration
          - control-plane

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock=false
          fi

      - name: Execute mandatory quality gate
        run: npm run "test:${{ matrix.gate }}"
