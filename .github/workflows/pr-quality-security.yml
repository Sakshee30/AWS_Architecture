name: PR Quality and Security
on:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  precommit-equivalent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package-lock.json') != '' }}
        with: {node-version: "22"}
      - run: npm ci
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm run format:check --if-present
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm run lint --if-present
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm run typecheck --if-present
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm test --if-present
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: for f in tests/architecture/validate_section*.py; do python "$f"; done
  dependency-license-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package-lock.json') != '' }}
        with: {node-version: "22"}
      - run: npm ci
        if: ${{ hashFiles('package-lock.json') != '' }}
      - run: npm audit --audit-level=high
        if: ${{ hashFiles('package-lock.json') != '' }}
      - name: License check
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx --yes license-checker-rseidelsohn --production --summary
      - name: Contract tests
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm run test:contract --if-present
      - name: Sections 1-15 integration pending
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: echo "Dependency/license/contract runtime checks require teammate workspace integration."
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ".", format: table, exit-code: "1", severity: "HIGH,CRITICAL"}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/analyze@v3
  iac-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: config, scan-ref: infrastructure, format: table, exit-code: "1", severity: "HIGH,CRITICAL"}
      - run: docker build -f infrastructure/docker/api.Dockerfile -t section21-pr-api:${GITHUB_SHA} .
