name: PR Quality and Security
on:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  precommit-equivalent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock=false; fi
      - run: npm run format:check --if-present
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: for f in tests/architecture/validate_section*.py; do python "$f"; done
  dependency-license-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --package-lock=false; fi
      - run: npm audit --audit-level=high || true
      - name: License check
        run: npx --yes license-checker-rseidelsohn --production --summary
      - name: Contract tests
        run: npm run test:contract --if-present
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --redact --source=.
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ".", format: table, exit-code: "1", severity: "HIGH,CRITICAL"}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: javascript-typescript}
      - uses: github/codeql-action/analyze@v3
  iac-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure
          format: table
          exit-code: "1"
          severity: "CRITICAL"
      - run: docker build -f infrastructure/docker/api.Dockerfile -t section21-pr-api:${GITHUB_SHA} .
