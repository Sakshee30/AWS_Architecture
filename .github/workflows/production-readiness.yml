name: Production Readiness Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/production-readiness.yaml"
      - "scripts/production-readiness.py"
      - "evidence/**"
      - ".github/workflows/production-readiness.yml"
permissions:
  contents: read
jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tests/architecture/validate_section30.py
  evidence-gate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed unless all production evidence is present
        run: python scripts/production-readiness.py
