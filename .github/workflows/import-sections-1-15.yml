name: Import teammate Sections 1-15
on:
  pull_request:
    types: [reopened]
permissions:
  contents: write
jobs:
  merge-teammate:
    if: ${{ github.head_ref == 'integrate-sections-1-15' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-sections-1-15
          fetch-depth: 0
      - name: Merge teammate Sections 1-15 without deleting Sections 16-30
        run: |
          set -euo pipefail
          git config user.name "Sakshee30"
          git config user.email "98686393+Sakshee30@users.noreply.github.com"
          git remote add teammate https://github.com/Boby-Mourya/AWS.git
          git fetch teammate main
          git merge teammate/main --allow-unrelated-histories -X ours --no-edit -m "Merge teammate Sections 1-15 implementation"
          git push origin HEAD:integrate-sections-1-15
