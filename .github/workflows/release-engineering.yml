name: Release Engineering
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  pr-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository architecture gates
        run: |
          python tests/architecture/validate_section19.py
          python tests/architecture/validate_section20.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: config, scan-ref: infrastructure, severity: 'HIGH,CRITICAL', exit-code: '1'}
  build-sbom:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable image
        id: image
        run: |
          docker build -f infrastructure/docker/Dockerfile -t platform:${GITHUB_SHA} .
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' platform:${GITHUB_SHA} 2>/dev/null || echo platform:${GITHUB_SHA})" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with: {image: 'platform:${{ github.sha }}', artifact-name: sbom.spdx.json, output-file: sbom.spdx.json}
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: 'platform:${{ github.sha }}', severity: 'HIGH,CRITICAL', exit-code: '1'}
  promote:
    needs: build-sbom
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Record release provenance
        run: |
          mkdir -p release-evidence
          printf '%s\n' "commit=${GITHUB_SHA}" "image=${{ needs.build-sbom.outputs.digest }}" "config_version=from-control-plane" "migration_version=019+" > release-evidence/release.txt
      - uses: actions/upload-artifact@v4
        with: {name: release-evidence, path: release-evidence}
