criteria:
 architecture: "no optional infrastructure SDK imports in domain; architecture tests pass"
 configuration: "schema-valid provider/capability combinations; fail before production impact"
 redis_off: "supported requests continue using approved fallbacks"
 kafka_off: "outbox retains events; alternate delivery; idempotent consumers"
 search_off: "PostgreSQL fallback functional at documented limits"
 ai_off: "non-AI platform operational; AI UI/actions disabled cleanly"
 compute_portability: "same immutable images in supported Docker/ECS/EKS profiles"
 control_panel: "desired/actual/health/fallback/dependencies/cost-impact/version/history visible"
 production_changes: "high risk requires validation/approval/verification/rollback"
 security: "no plaintext prod secrets; least privilege; WAF/TLS/auth/tenant isolation/scans"
 observability: "correlation IDs plus metrics/logs/traces; alerts/runbooks"
 resilience: "failure tests prove safe degradation/controlled failure"
 backup_dr: "restore tests meet RPO/RTO or gaps recorded"
 cicd: "protected main plus tests/scans/image scan/SBOM/signing/promotion"
 documentation: "architecture/provider matrix/runbooks/change procedures current"
