apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-worker
  template:
    metadata:
      labels:
        app: platform-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: REPLACE_WITH_IMMUTABLE_DIGEST
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: platform-worker
  namespace: workers
spec:
  scaleTargetRef:
    name: platform-worker
  minReplicaCount: 0
  maxReplicaCount: 50
  triggers:
  - type: aws-sqs-queue
    metadata:
      queueURLFromEnv: JOB_QUEUE_URL
      queueLength: "20"
      awsRegion: ap-south-1
