apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workers-default-deny
  namespace: workers
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-worker-egress
  namespace: workers
spec:
  podSelector:
    matchLabels:
      app: platform-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
